name: Deploy JANU AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies and build
        run: |
          npm install
          npm run build

      - name: Configure Wrangler credentials
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Install Wrangler
        run: npx --yes wrangler@latest --version

      - name: Configure Worker secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JANU_OWNER_PASSWORD: ${{ secrets.JANU_OWNER_PASSWORD }}
          JANU_OWNER_SECRET: ${{ secrets.JANU_OWNER_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          for name in JANU_OWNER_PASSWORD JANU_OWNER_SECRET OPENAI_API_KEY; do
            value="${!name}"
            test -n "$value" || (echo "Missing repository secret: $name" && exit 1)
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$name"
          done

      - name: Deploy Worker and frontend assets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Smoke test deployed JANU API and Realtime credentials
        env:
          JANU_OWNER_PASSWORD: ${{ secrets.JANU_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          BASE_URL="https://janu-ai-api.s15323052.workers.dev"
          echo "Checking public health endpoint..."
          health="$(curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/health")"
          echo "$health" | jq -e '.ok == true and .configured == true' >/dev/null
          echo "Health check passed."
          echo "Checking owner login..."
          login_payload="$(jq -n --arg password "$JANU_OWNER_PASSWORD" '{password:$password}')"
          login="$(curl -fsS -H 'Content-Type: application/json' -d "$login_payload" "$BASE_URL/api/auth/login")"
          token="$(echo "$login" | jq -er '.token')"
          test -n "$token"
          echo "Owner login passed."
          echo "Checking Realtime client credential creation..."
          realtime="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"voice":"coral"}' "$BASE_URL/api/realtime/session")"
          echo "$realtime" | jq -e '.clientSecret | type == "string" and length > 5' >/dev/null
          echo "Realtime credential check passed. No microphone audio was sent."
          echo "Checking frontend asset delivery..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/" >/dev/null
          echo "Frontend delivery passed."
